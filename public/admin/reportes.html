<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes · Panel administrativo</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/panel.css">
</head>
<body class="panel-body">
  <div class="admin-shell" id="adminShell">
    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <h1>Reportes</h1>
          <p>Indicadores básicos de gestión del consultorio (RF-25).</p>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="date" id="desde" style="border:1px solid rgba(122,88,52,.28);border-radius:12px;padding:9px 12px;">
          <span>a</span>
          <input type="date" id="hasta" style="border:1px solid rgba(122,88,52,.28);border-radius:12px;padding:9px 12px;">
          <button class="btn btn-primary btn-sm" id="btnFiltrar" type="button">Filtrar</button>
        </div>
      </div>

      <div class="stat-grid" id="statGrid"></div>

      <div class="panel-card">
        <h2>Citas por estado</h2>
        <div class="table-wrap"><table class="data-table" id="tablaEstado"><tbody></tbody></table></div>
      </div>

      <div class="panel-card">
        <h2>Citas por odontólogo</h2>
        <div class="table-wrap"><table class="data-table" id="tablaOdontologo"><tbody></tbody></table></div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin/common.js"></script>
  <script src="/js/admin/reportes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso administrativo · Sonrisa Digital</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/panel.css">
</head>
<body class="panel-body">
  <div class="login-screen">
    <form class="login-card" id="loginForm">
      <div class="logo-dot">LG</div>
      <h1>Panel administrativo</h1>
      <p class="subt">Odontología Especializada · Sonrisa Digital</p>

      <div class="form-error" id="formError"></div>

      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username" placeholder="admin@sonrisadigital.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Ingresar</button>
      <p style="text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:16px;">
        <a href="/index.html">← Volver al sitio</a> &nbsp;·&nbsp; <a href="/agenda/login.html">Soy odontólogo/auxiliar</a>
      </p>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (Api.getToken("admin")) location.href = "/admin/dashboard.html";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("formError");
      const submitBtn = document.getElementById("submitBtn");
      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Ingresando...";

      try {
        const data = await Api.post("/api/auth/admin/login", {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        });
        Api.setToken("admin", data.token);
        location.href = "/admin/dashboard.html";
      } catch (err) {
        errorBox.textContent = err.message || "No se pudo iniciar sesión";
        errorBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>

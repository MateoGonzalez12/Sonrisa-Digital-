<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso agenda móvil · Sonrisa Digital</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#D2C4B7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/panel.css">
</head>
<body class="panel-body">
  <div class="login-screen">
    <form class="login-card" id="loginForm">
      <div class="logo-dot">LG</div>
      <h1>Agenda móvil</h1>
      <p class="subt">Identificación simple con PIN</p>

      <div class="form-error" id="formError"></div>

      <div class="field">
        <label>Selecciona tu nombre</label>
        <div class="pin-grid" id="pinGrid"><div class="empty-state">Cargando…</div></div>
      </div>

      <div class="field">
        <label for="pin">PIN</label>
        <input type="password" id="pin" inputmode="numeric" pattern="\d{4,6}" maxlength="6" required placeholder="••••">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn" disabled>Ingresar</button>

      <button type="button" class="btn btn-block" id="btnFaceId" style="display:none;margin-top:10px;">
        <span id="btnFaceIdTexto">Entrar con Face ID</span>
      </button>
      <p style="text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:16px;">
        <a href="/index.html">← Volver al sitio</a> &nbsp;·&nbsp; <a href="/admin/login.html">Soy administrativo</a>
      </p>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/agenda/pwa.js"></script>
  <script src="/js/agenda/login.js"></script>
</body>
</html>

<!DOCTYPE html>

<body class="panel-body">
  <div class="mobile-shell">
    <div class="mobile-header">
      <div class="avatar" id="avatarStaff">--</div>
      <div>
        <b id="nombreStaff">Cargando…</b>
        <span>Agenda móvil · Sonrisa Digital</span>
      </div>
      <button class="phone-close" style="margin-left:auto;" onclick="cerrarSesionStaff()">⏻</button>
    </div>
    <div class="mobile-tabs">

    <div id="avisoMovil" class="aviso-movil" style="display:none;">
      <div class="aviso-texto" id="avisoTexto"></div>

        <button type="button" class="aviso-cerrar" id="avisoCerrar" title="Ocultar">&times;</button>
      </div>
    </div>

    <div id="avisoBiometria" class="aviso-movil" style="display:none;">

        <button type="button" class="aviso-cerrar" id="bioCerrar" title="Ocultar">&times;</button>
      </div>
    </div>

    <div class="mobile-body" id="listaHoy">
      <div class="empty-state">Cargando…</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
